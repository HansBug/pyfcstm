name: Package Release

# Thin entry point: everything a release builds, checks and publishes lives in
# release_pipeline.yml, the same file Release Test runs with publish: false.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to stage, verify, and publish'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pyfcstm-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release_target:
    name: Resolve the release tag
    runs-on: ubuntu-22.04
    if: ${{ github.repository == 'hansbug/pyfcstm' }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Checkout the requested tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Resolve the tag to its commit
        id: resolve
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          git fetch --tags --force --quiet
          commit="$(git rev-parse "${tag}^{commit}")"
          test "$commit" = "$(git rev-parse HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit"

  pipeline:
    name: Release
    needs: release_target
    uses: ./.github/workflows/release_pipeline.yml
    with:
      tag: ${{ needs.release_target.outputs.tag }}
      commit: ${{ needs.release_target.outputs.commit }}
      publish: true
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
