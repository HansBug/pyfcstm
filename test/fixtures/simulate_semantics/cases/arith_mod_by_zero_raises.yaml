title: "Integer modulo by zero raises a structured expression error"
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/449
  notes:
  - "Message wording is host-CPython dependent -- 'integer division or modulo by zero' up to 3.10, 'integer modulo by zero' in 3.11, 'division by zero' in the newest interpreters -- so this fixture pins the exception and cause classes rather than the text."
categories:
- runtime
- template_alignment
exclude_runners:
- bmc_core
steps:
- cycle: []
  expect:
    raises:
      type: SimulationRuntimeExpressionError
      cause_type: ZeroDivisionError
    vars_exact:
      r: 0
    ended: false
