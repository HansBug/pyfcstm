title: Tie-breaking in a transition guard selects the even-neighbour branch
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/451
  notes:
  - 'Guard context: an away-from-zero round() would take the other transition, so this
  pins reachability rather than a variable value.'
categories:
- runtime
- template_alignment
steps:
- cycle: []
  expect:
    state: Root.A
    vars:
      a: 2.5
      hit: 0
    ended: false
- cycle: []
  expect:
    state: Root.B
    vars:
      a: 2.5
      hit: 1
    ended: false
