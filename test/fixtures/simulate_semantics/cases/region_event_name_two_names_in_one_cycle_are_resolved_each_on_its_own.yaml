title: Every name of a cycle is resolved on its own, from the position at the start of the cycle
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
- hot_start
exclude_runners:
- generated_python_alignment
- bmc_core
initial:
  configuration: 'Controller.Running{Safety: Watching, Motion: Off}'
  vars:
    trail: 0
steps:
- cycle:
  - Trip
  - Go
  expect:
    configuration: 'Controller.Running{Safety: Tripped, Motion: On}'
    vars:
      trail: 0
