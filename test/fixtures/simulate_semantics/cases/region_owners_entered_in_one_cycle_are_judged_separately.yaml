title: Two owners reached in the same cycle with the same values each get their own answer to whether they can continue
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
  notes:
  - Owner A may finish at once because it continues to B. Owner B has no outgoing transition, so its region must
    not take the candidate that finishes and takes the second one instead.
categories:
- regions
- runtime
exclude_runners:
- generated_python_alignment
- bmc_core
steps:
- cycle: []
  expect:
    configuration: 'Root.B{R: W}'
- cycle: []
  expect:
    configuration: 'Root.B{R: W}'
