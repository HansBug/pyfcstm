title: A position in which every region of an owner is done is not one the machine can rest in
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
- hot_start
exclude_runners:
- generated_python_alignment
- bmc_core
initial:
  configuration: 'W.Job{A: [done], B: [done]}'
  vars:
    seq: 0
    n: 0
  expect:
    raises:
      type: ValueError
      match: All regions are Done
      match_kind: substring
steps: []
