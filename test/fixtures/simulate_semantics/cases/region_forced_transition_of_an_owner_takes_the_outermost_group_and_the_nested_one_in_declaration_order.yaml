title: A forced transition above two nested owners takes the outermost group away, the regions of every group in declaration order and each nested owner after its regions
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
  notes:
  - "The digits are the exit actions in order: nested regions X and Y, the nested owner, then region R2, then the owner itself; 9 is the entry of the target."
categories:
- regions
- runtime
exclude_runners:
- generated_python_alignment
steps:
- cycle: []
  expect:
    configuration: 'Root.Outer{R1: Inner{X: X1, Y: Y1}, R2: Z1}'
    vars:
      seq: 0
    delta: false
- cycle:
  - Root.Halt
  expect:
    configuration: Root.Off
    vars:
      seq: 124359
    delta: false
- cycle: []
  expect:
    configuration: Root.Off
    vars:
      seq: 124359
    delta: false
