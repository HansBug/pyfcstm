title: "Real cube root is exact on perfect cubes and keeps the sign"
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/522
  notes:
  - "cbrt(1000) is exactly 10.0, cbrt(-8) is -2.0 and cbrt(27) is 3.0, where x ** (1/3) or a platform cbrt that is not correctly rounded would be inexact."
categories:
- runtime
- template_alignment
steps:
- cycle: []
  expect:
    state: Root.A
    vars:
      a: 10.0
      b: -2.0
      c: 3.0
    ended: false
- cycle: []
  expect:
    state: Root.A
    vars:
      a: 10.0
      b: -2.0
      c: 3.0
    ended: false
