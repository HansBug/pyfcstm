title: 'An owner written as a bare path waits for initialization: its own enter does not run, every region
  initializes in writing order in the first cycle'
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
  notes:
  - 'seq = 12345: Q, W1, W2, Comp and In1 are entered; the enter of the hot-started owner does not run.'
categories:
- regions
- runtime
- hot_start
exclude_runners:
- generated_python_alignment
- bmc_core
initial:
  configuration: W.Job
  vars:
    seq: 0
    n: 0
steps:
- cycle: []
  expect:
    configuration: 'W.Job{A: Q{A1: W1, A2: W2}, B: Comp.In1}'
    vars:
      seq: 12345
      n: 10101
