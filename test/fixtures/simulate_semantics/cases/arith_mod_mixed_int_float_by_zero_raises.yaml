title: "Mixed int/float modulo by zero reports the float modulo diagnostic"
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/449
  notes:
  - "Pins the promotion rule: int % float promotes to float, so the diagnostic is 'float modulo' rather than the integer wording."
categories:
- runtime
- template_alignment
exclude_runners:
- bmc_core
steps:
- cycle: []
  expect:
    raises:
      type: SimulationRuntimeExpressionError
      cause_type: ZeroDivisionError
    vars_exact:
      r: 0.0
    ended: false
