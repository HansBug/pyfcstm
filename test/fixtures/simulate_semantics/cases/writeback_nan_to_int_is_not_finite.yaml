title: NaN written to an int is rejected as not finite
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/455
  notes:
  - >-
    BMC core exclusion: Non-finite values have no real-number encoding in BMC, and the case expects a step error that the BMC core runner does not model.
  - >-
    A non-finite value written to an int variable is rejected with the
    simulator's finite-value message; the C runtimes used to report the value
    as outside the int64 range instead.
exclude_runners:
- bmc_core
categories:
- runtime
- template_alignment
steps:
- cycle: []
  expect:
    raises:
      type: SimulationRuntimeExpressionError
      match: declared int must be finite, got nan
      match_kind: substring
    vars:
      r: 0
