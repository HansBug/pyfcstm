title: A forced transition of the owner wins over a child completion in the same cycle and the regions exit in declaration order
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
exclude_runners:
- bmc_core
steps:
- cycle: []
  expect:
    configuration: 'Workflow.Job{A: Working, B: Working}'
    vars:
      a: 1
      b: 1
      order: 0
- cycle:
  - Workflow.ADone
  - Workflow.Cancel
  expect:
    configuration: Workflow.Idle
    vars:
      a: 1
      b: 1
      order: 123
    ended: false
