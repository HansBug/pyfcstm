title: floor, ceil, trunc and round results are integers that can be shifted
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/455
  notes:
  - >-
    BMC core exclusion: The shifts are bitwise operators, which have no exact Z3 encoding in the default profile (#254), so the BMC core reports them as unsupported.
  - >-
    The generated C runtime declared these functions as integer-valued but
    emitted a double, so a shift of their result did not compile.  floor(2.5)
    is 2, ceil(2.5) is 3, trunc(2.7) is 2 and round(2.5) is 2 (ties to even).
exclude_runners:
- bmc_core
categories:
- runtime
- template_alignment
steps:
- cycle: []
  expect:
    state: Root.A
    vars:
      x: 4
      y: 6
      z: 4
      w: 4
    ended: false
