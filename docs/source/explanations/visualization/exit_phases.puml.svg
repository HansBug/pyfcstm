<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="830px" preserveAspectRatio="none" style="width:910px;height:830px;background:#FFFFFF;" version="1.1" viewBox="0 0 910 830" width="910px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="466" x="223.5" y="27.9951">Where a viewer directory is reclaimed, and why not earlier</text><rect fill="none" height="74.3984" style="stroke:#000000;stroke-width:1.5;" width="315" x="343" y="387.2188"/><rect fill="none" height="117.5313" style="stroke:#000000;stroke-width:1.5;" width="561" x="343" y="475.6172"/><rect fill="none" height="74.3984" style="stroke:#000000;stroke-width:1.5;" width="349" x="343" y="607.1484"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="30" x2="30" y1="89.8906" y2="779.0781"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="213.5" x2="213.5" y1="89.8906" y2="779.0781"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="427" x2="427" y1="89.8906" y2="779.0781"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="686.5" x2="686.5" y1="89.8906" y2="779.0781"/><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="5" y="58.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36" x="12" y="78.5889">caller</text><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="5" y="778.0781"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36" x="12" y="798.0732">caller</text><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="51" x="188.5" y="58.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37" x="195.5" y="78.5889">atexit</text><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="51" x="188.5" y="778.0781"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37" x="195.5" y="798.0732">atexit</text><rect fill="#E2E2F0" height="46.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="148" x="353" y="42.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134" x="360" y="62.292">multiprocessing.util</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94" x="380" y="78.5889">_exit_function</text><rect fill="#E2E2F0" height="46.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="148" x="353" y="778.0781"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134" x="360" y="798.0732">multiprocessing.util</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94" x="380" y="814.3701">_exit_function</text><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="61" x="656.5" y="58.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="47" x="663.5" y="78.5889">worker</text><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="61" x="656.5" y="778.0781"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="47" x="663.5" y="798.0732">worker</text><line style="stroke:#181818;stroke-width:1.0;" x1="30" x2="72" y1="121.0234" y2="121.0234"/><line style="stroke:#181818;stroke-width:1.0;" x1="72" x2="72" y1="121.0234" y2="134.0234"/><line style="stroke:#181818;stroke-width:1.0;" x1="31" x2="72" y1="134.0234" y2="134.0234"/><polygon fill="#181818" points="41,130.0234,31,134.0234,41,138.0234,37,134.0234" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170" x="37" y="115.9575">show(open_window=False)</text><path d="M35,147.0234 L35,217.0234 L244,217.0234 L244,157.0234 L234,147.0234 L35,147.0234 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M234,147.0234 L234,157.0234 L244,157.0234 L234,147.0234 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175" x="41" y="164.0903">Registers the reclaim twice:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188" x="41" y="179.2231">an atexit hook, and a finalizer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="41" y="194.356">at priority -1 when a worker</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="66" x="41" y="209.4888">may exist.</text><polygon fill="#181818" points="202,239.6875,212,243.6875,202,247.6875,206,243.6875" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="30" x2="208" y1="243.6875" y2="243.6875"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102" x="37" y="238.6216">interpreter exits</text><line style="stroke:#181818;stroke-width:1.0;" x1="214" x2="256" y1="272.8203" y2="272.8203"/><line style="stroke:#181818;stroke-width:1.0;" x1="256" x2="256" y1="272.8203" y2="285.8203"/><line style="stroke:#181818;stroke-width:1.0;" x1="215" x2="256" y1="285.8203" y2="285.8203"/><polygon fill="#181818" points="225,281.8203,215,285.8203,225,289.8203,221,285.8203" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191" x="221" y="267.7544">run hooks, last registered first</text><line style="stroke:#181818;stroke-width:1.0;" x1="214" x2="256" y1="330.0859" y2="330.0859"/><line style="stroke:#181818;stroke-width:1.0;" x1="256" x2="256" y1="330.0859" y2="343.0859"/><line style="stroke:#181818;stroke-width:1.0;" x1="215" x2="256" y1="343.0859" y2="343.0859"/><polygon fill="#181818" points="225,339.0859,215,343.0859,225,347.0859,221,343.0859" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145" x="221" y="309.8872">reclaim: rmdir refused,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199" x="221" y="325.02">the worker still holds the viewer</text><polygon fill="#181818" points="415,368.2188,425,372.2188,415,376.2188,419,372.2188" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="214" x2="421" y1="372.2188" y2="372.2188"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="88" x="221" y="367.1528">_exit_function</text><path d="M343,387.2188 L653,387.2188 L653,394.3516 L643,404.3516 L343,404.3516 L343,387.2188 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="74.3984" style="stroke:#000000;stroke-width:1.5;" width="315" x="343" y="387.2188"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="265" x="358" y="400.2856">phase 1 -- finalizers at priority &gt;= 0</text><line style="stroke:#181818;stroke-width:1.0;" x1="427" x2="469" y1="440.6172" y2="440.6172"/><line style="stroke:#181818;stroke-width:1.0;" x1="469" x2="469" y1="440.6172" y2="453.6172"/><line style="stroke:#181818;stroke-width:1.0;" x1="428" x2="469" y1="453.6172" y2="453.6172"/><polygon fill="#181818" points="438,449.6172,428,453.6172,438,457.6172,434,453.6172" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129" x="434" y="420.4185">nothing of ours here</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111" x="434" y="435.5513">(that is the point)</text><path d="M343,475.6172 L782,475.6172 L782,482.75 L772,492.75 L343,492.75 L343,475.6172 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="117.5313" style="stroke:#000000;stroke-width:1.5;" width="561" x="343" y="475.6172"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="394" x="358" y="488.6841">phase 2 -- terminate daemons, join every active child</text><polygon fill="#181818" points="675,509.8828,685,513.8828,675,517.8828,679,513.8828" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="427" x2="681" y1="513.8828" y2="513.8828"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="22" x="434" y="508.8169">join</text><line style="stroke:#181818;stroke-width:1.0;" x1="687" x2="729" y1="543.0156" y2="543.0156"/><line style="stroke:#181818;stroke-width:1.0;" x1="729" x2="729" y1="543.0156" y2="556.0156"/><line style="stroke:#181818;stroke-width:1.0;" x1="688" x2="729" y1="556.0156" y2="556.0156"/><polygon fill="#181818" points="698,552.0156,688,556.0156,698,560.0156,694,556.0156" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198" x="694" y="537.9497">unlink the viewer it was handed</text><polygon fill="#181818" points="438,581.1484,428,585.1484,438,589.1484,434,585.1484" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="432" x2="686" y1="585.1484" y2="585.1484"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="39" x="444" y="580.0825">exited</text><path d="M343,607.1484 L613,607.1484 L613,614.2813 L603,624.2813 L343,624.2813 L343,607.1484 " fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="74.3984" style="stroke:#000000;stroke-width:1.5;" width="349" x="343" y="607.1484"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="225" x="358" y="620.2153">phase 3 -- remaining finalizers</text><line style="stroke:#181818;stroke-width:1.0;" x1="427" x2="469" y1="660.5469" y2="660.5469"/><line style="stroke:#181818;stroke-width:1.0;" x1="469" x2="469" y1="660.5469" y2="673.5469"/><line style="stroke:#181818;stroke-width:1.0;" x1="428" x2="469" y1="673.5469" y2="673.5469"/><polygon fill="#181818" points="438,669.5469,428,673.5469,438,677.5469,434,673.5469" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133" x="434" y="640.3481">reclaim at priority -1:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246" x="434" y="655.481">the directory is empty, rmdir succeeds</text><path d="M303,693.5469 L303,763.5469 L551,763.5469 L551,703.5469 L541,693.5469 L303,693.5469 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M541,693.5469 L541,703.5469 L551,703.5469 L541,693.5469 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227" x="309" y="710.6138">A reclaim in phase 1 spends its one</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223" x="309" y="725.7466">chance on a directory that is about</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219" x="309" y="740.8794">to empty. Negative priority is what</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="129" x="309" y="756.0122">puts it after the join.</text><!--SRC=[PLF1Yjim4BtxAuOzxK8IkktDi0iXq6CFXP1B8AZs99v6bemqZfj-VPyiPxsc5sDvtkYzD_EiefRfq71WCdGJ7ZXGBO4hzU5E4WclraZBzOgCgsbexkIy4fjWXKDHT2QeLD8Pf_HK6MivF969j5jMZF8VqR6oNLRQtgfqmLSSexZBfbUnHtTAyDEvTvMATsFVVjat-72Tk0v5iQFrE-rAYeqVddt7xZI8g_tmzjtOo2y5D3C5kJHA_WnnH3_v8b4vHDA67pP91wcuHDauofgfyVwQpHiwYpDM_i8u44fT41z4xxH-nMGOBPHbeToQEw4_wgPWz2O1aynjIUB0t0N6Cu4q5jkf4detCiOLMHCLmh9Cha4Ueix0h1WlBHQ6uxcFsDBH9JjP1KNCqk8wMsUNUS7vYdr9oo4NnINulgEkCP7fbTRhsMvSk7r_eozmk9-kWRK6cqk3zJsWAKr7zwmDUYGJTnwENz8WbYnV4mlSjI32Wch3hNUm_XjuuXiZWmRYRanL8xP-a1xA4O7ZOJhspegxVZ99sDo0R3HO7DSPcUKcq_ZodvPlIKlWreXBRcRldwm-OhBSVPc7llXlkEtqlfgM4_kgOgvZ9Xspw64EaIRQVbmAou_PHoGOEqCmo3i6geAF2bqfOZFFOyJcb-yLAFMPTqC_-6B6kNt816m07AYkrtGrcNEANrAUXZd7z1y0]--></g></svg>