title: "Float zero base with a negative exponent raises during evaluation"
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/449
  notes:
  - "Exercises the float-typed base comparison, a different code path from the int-typed base."
categories:
- runtime
- template_alignment
exclude_runners:
- bmc_core
steps:
- cycle: []
  expect:
    raises:
      type: SimulationRuntimeExpressionError
      match: cannot be raised to a negative power
      match_kind: substring
      cause_type: ZeroDivisionError
      cause_match: cannot be raised to a negative power
      cause_match_kind: substring
    vars_exact:
      r: 0.0
    ended: false
