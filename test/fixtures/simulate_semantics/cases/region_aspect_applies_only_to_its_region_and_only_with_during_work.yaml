title: A region aspect covers only its own branch and is skipped when it has no during work
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
steps:
- cycle: []
  expect:
    configuration: 'Root.P{R1: A, R2: B}'
    vars:
      r1: 1
      r1after: 1
      r2: 1
      a: 1
      b: 1
- cycle: Root.End1
  expect:
    configuration: 'Root.P{R1: [done], R2: B}'
    vars:
      r1: 1
      r1after: 1
      r2: 2
      a: 1
      b: 2
- cycle: []
  expect:
    configuration: 'Root.P{R1: [done], R2: B}'
    vars:
      r1: 1
      r1after: 1
      r2: 3
      a: 1
      b: 3
