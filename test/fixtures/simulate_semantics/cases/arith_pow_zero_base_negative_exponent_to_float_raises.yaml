title: "Zero base with a negative exponent raises for a float target too"
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/449
  notes:
  - "Same evaluation-time error as the int target, proving the check cannot live in the writeback layer."
categories:
- runtime
- template_alignment
exclude_runners:
- bmc_core
steps:
- cycle: []
  expect:
    raises:
      type: SimulationRuntimeExpressionError
      match: cannot be raised to a negative power
      match_kind: substring
      cause_type: ZeroDivisionError
      cause_match: cannot be raised to a negative power
      cause_match_kind: substring
    vars_exact:
      r: 0.0
    ended: false
