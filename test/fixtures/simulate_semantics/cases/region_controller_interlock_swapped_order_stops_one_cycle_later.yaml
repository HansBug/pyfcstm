title: Swapping the region order delays the motor stop by one cycle
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
- inputs
- design_example
exclude_runners:
- bmc_core
steps:
- cycle: []
  inputs:
    fault: 0
    requested: 0
  expect:
    configuration: Controller.Idle
    vars:
      permit: 0
    outputs:
      motor: 0
- cycle: Controller.Start
  inputs:
    fault: 0
    requested: 0
  expect:
    configuration: 'Controller.Running{Motion: Off, Safety: Watching}'
    vars:
      permit: 1
    outputs:
      motor: 0
- cycle: []
  inputs:
    fault: 0
    requested: 1
  expect:
    configuration: 'Controller.Running{Motion: On, Safety: Watching}'
    vars:
      permit: 1
    outputs:
      motor: 1
- cycle: []
  inputs:
    fault: 1
    requested: 1
  expect:
    configuration: 'Controller.Running{Motion: On, Safety: Watching}'
    vars:
      permit: 0
    outputs:
      motor: 1
- cycle: []
  inputs:
    fault: 1
    requested: 1
  expect:
    configuration: 'Controller.Running{Motion: Off, Safety: Watching}'
    vars:
      permit: 0
    outputs:
      motor: 0
