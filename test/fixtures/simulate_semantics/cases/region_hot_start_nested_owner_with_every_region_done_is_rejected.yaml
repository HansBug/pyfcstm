title: Every region done is refused at any depth, not only at the outermost owner
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
- hot_start
exclude_runners:
- bmc_core
initial:
  configuration: 'W.Job{A: Q{A1: [done], A2: [done]}, B: Comp.In1}'
  vars:
    seq: 0
    n: 0
  expect:
    raises:
      type: ValueError
      match: All regions are Done
      match_kind: substring
steps: []
