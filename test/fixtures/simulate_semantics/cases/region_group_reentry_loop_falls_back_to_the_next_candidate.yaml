title: A group whose re-entry loops back to the same position is a dead path, so the next candidate is taken
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
exclude_runners:
- generated_python_alignment
steps:
- cycle: []
  expect:
    configuration: Root.Idle
    vars:
      b: 0
- cycle: Root.Idle.Go
  expect:
    configuration: Root.Fallback
    vars:
      b: 0
    delta: false
