title: A forced condition that asks whether a state of the group is active takes the group away in the cycle after the state was entered
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
  notes:
  - In the cycle that enters the state the condition was still false where the group rests, and later regions of the cycle do not decide again, so the group is taken in the next cycle.
categories:
- regions
- runtime
exclude_runners:
- generated_python_alignment
- bmc_core
steps:
- cycle: []
  expect:
    configuration: 'Root.P{A: Run, B: B1}'
    vars:
      seq: 1
    delta: false
- cycle:
  - Root.Fault
  expect:
    configuration: 'Root.P{A: Bad, B: B1}'
    vars:
      seq: 101
    delta: false
- cycle: []
  expect:
    configuration: Root.Safe
    vars:
      seq: 101
    delta: false
- cycle: []
  expect:
    configuration: Root.Safe
    vars:
      seq: 101
    delta: false
