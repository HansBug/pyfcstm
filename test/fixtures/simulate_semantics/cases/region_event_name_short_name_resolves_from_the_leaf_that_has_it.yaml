title: A short name is resolved from every active leaf; only one leaf has an event called Go, so that
  event is used
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
- hot_start
initial:
  configuration: 'Controller.Running{Safety: Watching, Motion: Off}'
  vars:
    trail: 0
steps:
- cycle:
  - Go
  expect:
    configuration: 'Controller.Running{Safety: Watching, Motion: On}'
    vars:
      trail: 0
- cycle:
  - Trip
  expect:
    configuration: 'Controller.Running{Safety: Tripped, Motion: On}'
    vars:
      trail: 0
