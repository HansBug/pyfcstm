title: A forced transition of the owner whose target cannot be entered does not take the group, and an ordinary
  transition of the owner on the same event does not take it either
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
  notes:
  - 'Nothing is exited: the digit 8 of the exit action never appears. Written with a plain composite instead of
    regions, the forced expansion would first leave the child and then let the composite pick its ordinary transition;
    a group is only ever taken as a whole by a forced transition that can commit.'
categories:
- regions
- runtime
exclude_runners:
- generated_python_alignment
- bmc_core
steps:
- cycle: []
  expect:
    configuration: 'Root.P{A: A1, B: B1}'
    vars:
      seq: 1
- cycle: Root.Stop
  expect:
    configuration: 'Root.P{A: A1, B: B1}'
    vars:
      seq: 11
- cycle: []
  expect:
    configuration: 'Root.P{A: A1, B: B1}'
    vars:
      seq: 111
