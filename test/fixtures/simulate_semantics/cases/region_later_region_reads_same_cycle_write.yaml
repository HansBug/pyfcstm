title: A later region reads the value an earlier region wrote in the same cycle
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
exclude_runners:
- generated_python_alignment
- bmc_core
steps:
- cycle: []
  expect:
    configuration: 'Root.P{W: A, Rd: B}'
    vars:
      x: 1
      y: 1
- cycle: []
  expect:
    configuration: 'Root.P{W: A, Rd: B}'
    vars:
      x: 2
      y: 2
