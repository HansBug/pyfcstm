title: "A power with a complex result raises"
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/522
  notes:
  - "(-8) ** 0.5 has no real value; the runtime raises instead of producing a complex number."
categories:
- runtime
- template_alignment
steps:
- cycle: []
  expect:
    raises:
      type: SimulationRuntimeExpressionError
      match: negative number cannot be raised to a fractional power
      match_kind: substring
      cause_type: ValueError
    vars:
      r: 0.0
    ended: false
