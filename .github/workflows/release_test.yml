name: Release Test

# Thin entry point: runs release_pipeline.yml, the same file a real release
# runs, with publish: false. The release assets end up in the
# pyfcstm-release-rehearsal artifact instead of PyPI and the GitHub release.
# Only branch pushes trigger it; a tag push is the release itself.

on:
  push:
    branches:
      - '**'
    paths:
      # Source code & assets that ship in the package
      - 'pyfcstm/**'
      - 'editors/jsfcstm/**'
      - 'editors/vscode/**'
      - 'editors/fcstm.tmLanguage.json'
      - 'editors/fcstm-bmc-query.tmLanguage.json'
      - 'templates/**'
      - 'tools/**'
      # Build & packaging manifests
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'requirements*.txt'
      - 'Makefile'
      # Release workflows
      - '.github/workflows/release.yml'
      - '.github/workflows/release_pipeline.yml'
      - '.github/workflows/release_test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_target:
    name: Resolve the rehearsal release name
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@v7
      - name: Name the rehearsal after the package version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^__VERSION__: str = '\(.*\)'$/\1/p" pyfcstm/config/meta.py)"
          test -n "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\ncommit=%s\n' "$version" "$GITHUB_SHA"

  pipeline:
    name: Release
    needs: release_target
    uses: ./.github/workflows/release_pipeline.yml
    with:
      tag: ${{ needs.release_target.outputs.tag }}
      commit: ${{ needs.release_target.outputs.commit }}
      publish: false
