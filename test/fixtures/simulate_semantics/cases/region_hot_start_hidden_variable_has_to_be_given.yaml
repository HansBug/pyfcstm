title: Hidden variables are not derived, so a hot start that leaves one out is refused like any missing
  variable
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
- hot_start
exclude_runners:
- bmc_core
initial:
  configuration: 'Root.Run{A: A2, B: B1}'
  vars:
    n: 0
  expect:
    raises:
      type: ValueError
      match: initial_vars must provide all variables
      match_kind: substring
steps: []
