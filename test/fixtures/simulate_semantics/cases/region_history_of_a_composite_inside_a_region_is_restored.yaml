title: A composite inside a region remembers its child across a forced exit and restores it through its history,
  while the other region stays where it is
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
exclude_runners:
- bmc_core
steps:
- cycle: []
  expect:
    configuration: 'Root.P{A: K.K1, B: B1}'
- cycle: []
  expect:
    configuration: 'Root.P{A: K.K2, B: B1}'
- cycle: Root.Out
  expect:
    configuration: 'Root.P{A: Idle, B: B1}'
- cycle: Root.Back
  expect:
    configuration: 'Root.P{A: K.K2, B: B1}'
