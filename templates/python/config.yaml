expr_styles:
  python_expr:
    # Functions that can reject their argument report it with the runtime's
    # stable message; the same overrides apply to every runtime style.  The
    # integer functions keep Python's own wording, as the catalog does.
    <<: &runtime_math_functions
      UFunc(sin): "self._math(math.sin, {{ node.expr | expr_render }})"
      UFunc(cos): "self._math(math.cos, {{ node.expr | expr_render }})"
      UFunc(tan): "self._math(math.tan, {{ node.expr | expr_render }})"
      UFunc(asin): "self._math(math.asin, {{ node.expr | expr_render }})"
      UFunc(acos): "self._math(math.acos, {{ node.expr | expr_render }})"
      UFunc(acosh): "self._math(math.acosh, {{ node.expr | expr_render }})"
      UFunc(atanh): "self._math(math.atanh, {{ node.expr | expr_render }})"
      UFunc(sqrt): "self._math(math.sqrt, {{ node.expr | expr_render }})"
      UFunc(log): "self._math(math.log, {{ node.expr | expr_render }})"
      UFunc(log10): "self._math(math.log10, {{ node.expr | expr_render }})"
      UFunc(log2): "self._math(math.log2, {{ node.expr | expr_render }})"
      UFunc(log1p): "self._math(math.log1p, {{ node.expr | expr_render }})"
    base_lang: python
    Name: "self._vars[{{ node.name | tojson }}]"
    UFunc(sign): "self._sign({{ node.expr | expr_render }})"
    UFunc(cbrt): "self._cbrt({{ node.expr | expr_render }})"
    BinaryOp(**): "self._power({{ node.expr1 | expr_render }}, {{ node.expr2 | expr_render }})"
  python_scope_expr:
    <<: *runtime_math_functions
    base_lang: python
    Name: "{% if _stmt_default_var_roles[node.name] == 'input' %}self.get_input_{{ node.name }}(){% elif _stmt_default_var_roles[node.name] == 'param' %}self.get_param_{{ node.name }}(){% else %}scope[{{ node.name | tojson }}]{% endif %}"
    UFunc(sign): "self._sign({{ node.expr | expr_render }})"
    UFunc(cbrt): "self._cbrt({{ node.expr | expr_render }})"
    BinaryOp(**): "self._power({{ node.expr1 | expr_render }}, {{ node.expr2 | expr_render }})"

stmt_styles:
  python_runtime:
    base_lang: python
    expr_lang: python
    state_var_target: "{% if _stmt_default_var_roles[name] == 'input' %}self.get_input_{{ name }}(){% elif _stmt_default_var_roles[name] == 'param' %}self.get_param_{{ name }}(){% else %}_v[{{ name | tojson }}]{% endif %}"
    temp_var_target: "{{ name }}"
    expr_templates:
      <<: *runtime_math_functions
      UFunc(sign): "_s({{ node.expr | expr_render }})"
      UFunc(cbrt): "_c({{ node.expr | expr_render }})"
      BinaryOp(**): "_p({{ node.expr1 | expr_render }}, {{ node.expr2 | expr_render }})"
    assign: |-
      {{ target }} = self._evaluate_runtime_expr(
          lambda: {{ expr }},
          {{ ("operation assignment to '" ~ name ~ "'") | tojson }},
      )
    if: |-
      if self._evaluate_runtime_expr(
          lambda: {{ condition }},
          "if-block condition",
      ):
    elif: |-
      elif self._evaluate_runtime_expr(
          lambda: {{ condition }},
          "if-block condition",
      ):

globals:
  machine_class_name:
    type: template
    params:
      - model
    template: "{{ model.root_state.name | to_identifier }}Machine"
  state_path:
    type: template
    params:
      - state
    template: "{{ state.path | join('.') }}"
  action_hook_name:
    type: template
    params:
      - action
    template: "_abstract_hook_{{ action.func_name | to_identifier }}"
  action_owner_path:
    type: template
    params:
      - action
    template: "{{ action.parent.path | join('.') }}"

filters:
  machine_class_name:
    type: template
    params:
      - model
    template: "{{ machine_class_name(model) }}"
  state_path:
    type: template
    params:
      - state
    template: "{{ state_path(state) }}"
  action_hook_name:
    type: template
    params:
      - action
    template: "{{ action_hook_name(action) }}"
  action_owner_path:
    type: template
    params:
      - action
    template: "{{ action_owner_path(action) }}"

ignores:
  - 'README.md'
  - 'README_zh.md'
  - 'template.json'
