title: active() is true from enter start, false after exit, false inside effects, and visible to a later
  region in the same cycle
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
- inputs
exclude_runners:
- generated_python_alignment
steps:
- cycle: []
  inputs:
    fault: 0
  expect:
    configuration: 'Root.P{Safety: Normal, Motion: Run}'
    vars:
      m: 1
      x1: 0
- cycle: []
  inputs:
    fault: 1
  expect:
    configuration: 'Root.P{Safety: Tripped, Motion: Stop}'
    vars:
      m: 1
      x1: 1
      x2: 2
      y1: 2
      y2: 2
      z1: 1
      z2: 2
