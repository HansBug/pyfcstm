title: A forced transition of the owner to the final state exits the group in declaration order and ends the machine
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
exclude_runners:
- generated_python_alignment
steps:
- cycle: []
  expect:
    configuration: 'Root.P{A: A1, B: B1}'
    vars:
      seq: 0
- cycle: Root.Kill
  expect:
    vars:
      seq: 213
    ended: true
