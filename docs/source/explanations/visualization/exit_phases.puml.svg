<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1029px;height:882px;background:#FFFFFF;" width="1029px" height="882px" viewBox="0 0 1029 882" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta11?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="281.437" y="27.995" fill="#000" font-size="14" textLength="465.11" font-weight="700">Where a viewer directory is reclaimed, and why not earlier</text></g><rect x="433.883" y="387.219" width="324.466" height="84.398" fill="none" style="stroke:#000;stroke-width:1.5;"/><rect x="433.883" y="489.617" width="576.101" height="127.531" fill="none" style="stroke:#000;stroke-width:1.5;"/><rect x="433.883" y="635.148" width="298.205" height="84.398" fill="none" style="stroke:#000;stroke-width:1.5;"/><g><title>caller</title><rect x="32.712" y="94.891" width="8" height="729.188" fill="#000" fill-opacity="0"/><line x1="36.212" y1="94.891" x2="36.212" y2="824.078" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>atexit</title><rect x="223.438" y="94.891" width="8" height="729.188" fill="#000" fill-opacity="0"/><line x1="226.938" y1="94.891" x2="226.938" y2="824.078" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>multiprocessing.util</title><rect x="446.383" y="94.891" width="8" height="729.188" fill="#000" fill-opacity="0"/><line x1="449.883" y1="94.891" x2="449.883" y2="824.078" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>worker</title><rect x="768.712" y="94.891" width="8" height="729.188" fill="#000" fill-opacity="0"/><line x1="772.212" y1="94.891" x2="772.212" y2="824.078" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="10" y="63.594" width="52.425" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="83.589" fill="#000" font-size="14" textLength="38.425">caller</text><rect x="199.765" y="63.594" width="54.346" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="206.765" y="83.589" fill="#000" font-size="14" textLength="40.346">atexit</text><rect x="373.82" y="47.297" width="152.127" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="380.82" y="67.292" fill="#000" font-size="14" textLength="138.127">multiprocessing.util</text><text x="401.15" y="83.589" fill="#000" font-size="14" textLength="97.467">_exit_function</text><rect x="741.088" y="63.594" width="62.248" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="748.088" y="83.589" fill="#000" font-size="14" textLength="48.248">worker</text><rect x="10" y="824.078" width="52.425" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="844.073" fill="#000" font-size="14" textLength="38.425">caller</text><rect x="199.765" y="824.078" width="54.346" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="206.765" y="844.073" fill="#000" font-size="14" textLength="40.346">atexit</text><rect x="373.82" y="824.078" width="152.127" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="380.82" y="844.073" fill="#000" font-size="14" textLength="138.127">multiprocessing.util</text><text x="401.15" y="860.37" fill="#000" font-size="14" textLength="97.467">_exit_function</text><rect x="741.088" y="824.078" width="62.248" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="748.088" y="844.073" fill="#000" font-size="14" textLength="48.248">worker</text><line x1="36.212" y1="124.023" x2="78.212" y2="124.023" style="stroke:#181818;stroke-width:1;"/><line x1="78.212" y1="124.023" x2="78.212" y2="137.023" style="stroke:#181818;stroke-width:1;"/><line x1="37.212" y1="137.023" x2="78.212" y2="137.023" style="stroke:#181818;stroke-width:1;"/><polygon points="47.212,133.023,37.212,137.023,47.212,141.023,43.212,137.023" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="43.212" y="118.958" fill="#000" font-size="13" textLength="176.725">show(open_window=False)</text><path d="M41.212,150.023 L41.212,220.023 L256.212,220.023 L256.212,160.023 L246.212,150.023 L41.212,150.023" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M246.212,150.023 L246.212,160.023 L256.212,160.023 L246.212,150.023" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="47.212" y="167.09" fill="#000" font-size="13" textLength="181.822">Registers the reclaim twice:</text><text x="47.212" y="182.223" fill="#000" font-size="13" textLength="194.346">an atexit hook, and a finalizer</text><text x="47.212" y="197.356" fill="#000" font-size="13" textLength="181.473">at priority -1 when a worker</text><text x="47.212" y="212.489" fill="#000" font-size="13" textLength="67.761">may exist.</text><polygon points="214.938,242.688,224.938,246.688,214.938,250.688,218.938,246.688" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="36.212" y1="246.688" x2="220.938" y2="246.688" style="stroke:#181818;stroke-width:1;"/><text x="43.212" y="241.622" fill="#000" font-size="13" textLength="105.631">interpreter exits</text><line x1="226.938" y1="275.82" x2="268.938" y2="275.82" style="stroke:#181818;stroke-width:1;"/><line x1="268.938" y1="275.82" x2="268.938" y2="288.82" style="stroke:#181818;stroke-width:1;"/><line x1="227.938" y1="288.82" x2="268.938" y2="288.82" style="stroke:#181818;stroke-width:1;"/><polygon points="237.938,284.82,227.938,288.82,237.938,292.82,233.938,288.82" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="233.938" y="270.754" fill="#000" font-size="13" textLength="196.454">run hooks, last registered first</text><line x1="226.938" y1="333.086" x2="268.938" y2="333.086" style="stroke:#181818;stroke-width:1;"/><line x1="268.938" y1="333.086" x2="268.938" y2="346.086" style="stroke:#181818;stroke-width:1;"/><line x1="227.938" y1="346.086" x2="268.938" y2="346.086" style="stroke:#181818;stroke-width:1;"/><polygon points="237.938,342.086,227.938,346.086,237.938,350.086,233.938,346.086" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="233.938" y="312.887" fill="#000" font-size="13" textLength="149.519">reclaim: rmdir refused,</text><text x="233.938" y="328.02" fill="#000" font-size="13" textLength="208.946">the worker still holds the viewer</text><polygon points="437.883,371.219,447.883,375.219,437.883,379.219,441.883,375.219" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="226.938" y1="375.219" x2="443.883" y2="375.219" style="stroke:#181818;stroke-width:1;"/><text x="233.938" y="370.153" fill="#000" font-size="13" textLength="90.505">_exit_function</text><path d="M433.883,387.219 L742.349,387.219 L742.349,394.352 L732.349,404.352 L433.883,404.352 L433.883,387.219" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="433.883" y="387.219" width="324.466" height="84.398" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="448.883" y="400.286" fill="#000" font-size="13" textLength="263.466" font-weight="700">phase 1 -- finalizers at priority >= 0</text><line x1="449.883" y1="450.617" x2="491.883" y2="450.617" style="stroke:#181818;stroke-width:1;"/><line x1="491.883" y1="450.617" x2="491.883" y2="463.617" style="stroke:#181818;stroke-width:1;"/><line x1="450.883" y1="463.617" x2="491.883" y2="463.617" style="stroke:#181818;stroke-width:1;"/><polygon points="460.883,459.617,450.883,463.617,460.883,467.617,456.883,463.617" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="456.883" y="430.418" fill="#000" font-size="13" textLength="132.45">nothing of ours here</text><text x="456.883" y="445.551" fill="#000" font-size="13" textLength="113.813">(that is the point)</text><path d="M433.883,489.617 L870.331,489.617 L870.331,496.75 L860.331,506.75 L433.883,506.75 L433.883,489.617" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="433.883" y="489.617" width="576.101" height="127.531" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="448.883" y="502.684" fill="#000" font-size="13" textLength="391.447" font-weight="700">phase 2 -- terminate daemons, join every active child</text><polygon points="760.212,533.883,770.212,537.883,760.212,541.883,764.212,537.883" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="449.883" y1="537.883" x2="766.212" y2="537.883" style="stroke:#181818;stroke-width:1;"/><text x="456.883" y="532.817" fill="#000" font-size="13" textLength="23.417">join</text><line x1="772.212" y1="567.016" x2="814.212" y2="567.016" style="stroke:#181818;stroke-width:1;"/><line x1="814.212" y1="567.016" x2="814.212" y2="580.016" style="stroke:#181818;stroke-width:1;"/><line x1="773.212" y1="580.016" x2="814.212" y2="580.016" style="stroke:#181818;stroke-width:1;"/><polygon points="783.212,576.016,773.212,580.016,783.212,584.016,779.212,580.016" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="779.212" y="561.95" fill="#000" font-size="13" textLength="207.771">unlink the viewer it was handed</text><polygon points="460.883,605.148,450.883,609.148,460.883,613.148,456.883,609.148" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="454.883" y1="609.148" x2="771.212" y2="609.148" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="466.883" y="604.083" fill="#000" font-size="13" textLength="40.65">exited</text><path d="M433.883,635.148 L702.568,635.148 L702.568,642.281 L692.568,652.281 L433.883,652.281 L433.883,635.148" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="433.883" y="635.148" width="298.205" height="84.398" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="448.883" y="648.215" fill="#000" font-size="13" textLength="223.685" font-weight="700">phase 3 -- remaining finalizers</text><line x1="449.883" y1="698.547" x2="491.883" y2="698.547" style="stroke:#181818;stroke-width:1;"/><line x1="491.883" y1="698.547" x2="491.883" y2="711.547" style="stroke:#181818;stroke-width:1;"/><line x1="450.883" y1="711.547" x2="491.883" y2="711.547" style="stroke:#181818;stroke-width:1;"/><polygon points="460.883,707.547,450.883,711.547,460.883,715.547,456.883,711.547" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="456.883" y="678.348" fill="#000" font-size="13" textLength="138.055">reclaim at priority -1:</text><text x="456.883" y="693.481" fill="#000" font-size="13" textLength="252.205">the directory is empty, rmdir succeeds</text><path d="M323.646,738.547 L323.646,808.547 L575.646,808.547 L575.646,748.547 L565.646,738.547 L323.646,738.547" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M565.646,738.547 L565.646,748.547 L575.646,748.547 L565.646,738.547" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="329.646" y="755.614" fill="#000" font-size="13" textLength="231.474">A reclaim in phase 1 spends its one</text><text x="329.646" y="770.747" fill="#000" font-size="13" textLength="228.427">chance on a directory that is about</text><text x="329.646" y="785.879" fill="#000" font-size="13" textLength="227.119">to empty. Negative priority is what</text><text x="329.646" y="801.012" fill="#000" font-size="13" textLength="133.466">puts it after the join.</text><?plantuml-src PLF1Yji