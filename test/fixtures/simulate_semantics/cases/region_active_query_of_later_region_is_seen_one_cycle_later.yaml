title: An earlier region reads a later region state one cycle late
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
- inputs
exclude_runners:
- generated_python_alignment
steps:
- cycle: []
  inputs:
    fault: 0
  expect:
    configuration: 'Root.P{Motion: Run, Safety: Normal}'
    vars:
      m: 1
- cycle: []
  inputs:
    fault: 1
  expect:
    configuration: 'Root.P{Motion: Run, Safety: Tripped}'
    vars:
      m: 2
      z1: 1
- cycle: []
  inputs:
    fault: 1
  expect:
    configuration: 'Root.P{Motion: Stop, Safety: Tripped}'
    vars:
      m: 2
