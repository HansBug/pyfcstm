title: A rejected group entry without another candidate keeps the whole cycle as Delta
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
categories:
- regions
- runtime
exclude_runners:
- generated_python_alignment
- bmc_core
steps:
- cycle: []
  expect:
    configuration: Root.Idle
    vars:
      leak: 0
- cycle: Root.Idle.Go
  expect:
    configuration: Root.Idle
    vars:
      leak: 0
      g: 0
    delta: true
- cycle: []
  expect:
    configuration: Root.Idle
    vars:
      leak: 0
    delta: false
