title: A forced condition that an earlier region makes true is seen by the regions after it in the same cycle, and by the earlier region in the next cycle
origin:
  files:
  - https://github.com/HansBug/pyfcstm/issues/248
  notes:
  - Region A raises x to 2 in the second cycle, after its own state already looked at the condition. Region B runs after A, sees x = 2 and finishes at once; region A finishes in the third cycle and the owner continues.
categories:
- regions
- runtime
exclude_runners:
- generated_python_alignment
steps:
- cycle: []
  expect:
    configuration: 'Root.P{A: A1, B: B1}'
    vars:
      x: 1
    delta: false
- cycle: []
  expect:
    configuration: 'Root.P{A: A1, B: [done]}'
    vars:
      x: 2
    delta: false
- cycle: []
  expect:
    configuration: Root.Off
    vars:
      x: 2
    delta: false
- cycle: []
  expect:
    configuration: Root.Off
    vars:
      x: 2
    delta: false
